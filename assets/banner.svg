<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tom Bruno: Open standards for AI code governance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1838"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <ellipse cx="1000" cy="160" rx="400" ry="200" fill="url(#glow)">
    <animate attributeName="rx" values="400;460;400" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1000;1060;1000" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <line x1="0" y1="100" x2="1280" y2="100" stroke="url(#accent)" stroke-width="1">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </line>

  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="700" fill="white" letter-spacing="-2.5">Tom Bruno</text>

  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#94A3B8" letter-spacing="0.5">Open standards for AI code governance</text>

  <g transform="translate(80, 248)">
    <rect width="180" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="90" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#06B6D4" letter-spacing="1.5" text-anchor="middle">FOUNDER · KOREXT</text>
  </g>

  <g transform="translate(80, 295)">
    <circle cx="0" cy="0" r="3" fill="#06B6D4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="0" r="3" fill="#06B6D4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="0" r="3" fill="#06B6D4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(1140, 80)">
    <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="226" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="226" to="0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="50" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">K</text>
  </g>
</svg>
