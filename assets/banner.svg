<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tom Bruno. Product and Ecosystem Leader, AI Ecosystems. Founder, Korext.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B1C"/>
      <stop offset="55%" stop-color="#0B1838"/>
      <stop offset="100%" stop-color="#142B63"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D7FE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .node { animation: pulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: 1.5s; } .n3 { animation-delay: 3s; } .n4 { animation-delay: 4.5s; }
      .edge { stroke-dasharray: 4 7; animation: flow 14s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }
      @keyframes flow { to { stroke-dashoffset: -220; } }
      @media (prefers-reduced-motion: reduce) { .node, .edge { animation: none; } }
      @media (max-width: 640px) {
        .net { display: none; }
        .title { font-size: 96px; }
        .role { font-size: 30px; }
        .sub { display: none; }
        .pills { transform: translate(80px, 256px) scale(1.45); }
      }
    </style>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <ellipse cx="1010" cy="170" rx="380" ry="230" fill="url(#glow)"/>
  <ellipse cx="760" cy="300" rx="320" ry="160" fill="url(#glow2)"/>

  <!-- Ecosystem graph: agents, platforms, publishers and standards connected -->
  <g class="net" fill="none">
    <g stroke="#7DD3FC" stroke-opacity="0.28" stroke-width="1">
      <path class="edge" d="M1010 170 L878 92"/>
      <path class="edge" d="M1010 170 L1150 86"/>
      <path class="edge" d="M1010 170 L1176 214"/>
      <path class="edge" d="M1010 170 L1060 290"/>
      <path class="edge" d="M1010 170 L880 252"/>
      <path class="edge" d="M878 92 L1150 86"/>
      <path class="edge" d="M1176 214 L1060 290"/>
      <path class="edge" d="M880 252 L878 92"/>
      <path class="edge" d="M1150 86 L1176 214"/>
    </g>
    <circle cx="1010" cy="170" r="54" stroke="#3B82F6" stroke-opacity="0.35"/>
    <circle cx="1010" cy="170" r="84" stroke="#3B82F6" stroke-opacity="0.16" stroke-dasharray="2 6"/>
    <circle cx="1010" cy="170" r="30" fill="#0B1838" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="1010" y="176" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="1">TB</text>
    <g fill="#06B6D4">
      <circle class="node" cx="878" cy="92" r="5"/>
      <circle class="node n2" cx="1150" cy="86" r="4"/>
      <circle class="node n3" cx="1176" cy="214" r="5"/>
      <circle class="node n4" cx="1060" cy="290" r="4"/>
      <circle class="node n2" cx="880" cy="252" r="4"/>
    </g>
    <g class="mono" font-size="10" fill="#94A3B8" letter-spacing="1.5">
      <text x="864" y="76">AGENTS</text>
      <text x="1112" y="70">PLATFORMS</text>
      <text x="1130" y="240">PUBLISHERS</text>
      <text x="1024" y="316">STANDARDS</text>
      <text x="826" y="276">DEVELOPERS</text>
    </g>
  </g>

  <rect x="80" y="86" width="64" height="2" fill="url(#rule)"/>
  <text x="80" y="72" class="mono" font-size="12" fill="#06B6D4" letter-spacing="3">SAN FRANCISCO BAY AREA</text>

  <text x="77" y="160" class="sans title" font-size="72" font-weight="700" fill="url(#name)" letter-spacing="-2">Tom Bruno</text>
  <text x="80" y="200" class="sans role" font-size="22" font-weight="500" fill="#E2E8F0">Product and Ecosystem Leader, AI Ecosystems</text>
  <text x="80" y="230" class="sans sub" font-size="17" fill="#94A3B8">Founder, Korext. Open standards and a governance runtime for AI generated code.</text>

  <g class="pills sans" transform="translate(80, 256)">
    <rect width="150" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="75" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#7DD3FC" letter-spacing="1.6">AI ECOSYSTEMS</text>
    <rect x="162" width="156" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="240" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#7DD3FC" letter-spacing="1.6">OPEN STANDARDS</text>
    <rect x="330" width="136" height="28" rx="14" fill="#06B6D4" fill-opacity="0.14" stroke="#06B6D4" stroke-opacity="0.5"/>
    <text x="398" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF" letter-spacing="1.6">FOUNDER, KOREXT</text>
  </g>
</svg>
